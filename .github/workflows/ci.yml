name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: relay/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: relay/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm agents:check
      - name: Spec check (every AC has a test)
        run: |
          shopt -s nullglob
          specs=(docs/specs/*.md)
          if [ ${#specs[@]} -eq 0 ]; then
            echo "No specs in docs/specs/"
            exit 0
          fi
          status=0
          for spec in "${specs[@]}"; do
            echo "== $spec"
            pnpm --silent spec:check "$spec" || status=1
          done
          exit $status
